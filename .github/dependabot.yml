version: 2
updates:
  # =============================================================================
  # npm ecosystems
  # =============================================================================
  # Note: We only monitor directories with actual dependencies declared.
  # /integrations/zapier is excluded intentionally.

  - package-ecosystem: "npm"
    directory: "/web-frontend"
    schedule:
      interval: "monthly"

  # =============================================================================
  # uv (Python) ecosystem
  # =============================================================================
  # Note: We only monitor /backend because backend/uv.lock contains all
  # resolved Python dependencies.

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
